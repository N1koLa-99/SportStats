<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Заявки за потвърждение</title>
  <link rel="stylesheet" href="Status.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="page">

  <!-- Хедър (в стила на Home/Settings) -->
  <header class="header">
    <div class="wrap">
      <div class="brand">
        <h1 class="brand-title"></h1>
      </div>

      <nav class="quick-actions">
        <a href="HomePage.html" class="icon-tile" aria-label="Начало">
          <i class="fas fa-home"></i>
          <span class="nav-label">Начало</span>
        </a>

        <button type="button" class="icon-tile" aria-label="Обнови" onclick="window.location.reload()">
          <i class="fas fa-rotate-right"></i>
          <span class="nav-label">Обнови</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Основно съдържание -->
  <main class="main wrap">
    <section class="card card-requests" aria-labelledby="requests-title">
      <div class="card-head">
        <h2 id="requests-title">Заявки за потвърждение</h2>
      </div>

      <div class="card-body">
        <!-- ЗАДЪЛЖИТЕЛНО: пазим ID-то за JS -->
        <div id="requests-container" class="requests-list">
          <p class="muted">Зареждане на заявки...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer wrap">
    <small>© SportStats</small>
  </footer>

  <!-- Същият JS (без промени по ID-та/логика) -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const userJson = localStorage.getItem("user");
      if (!userJson) {
        alert("Не сте влезли в профила си.");
        window.location.href = "Index.html";
        return;
      }

      const user = JSON.parse(userJson);
      const role = Number(user.roleID);
const isCoach = role === 2;
const isAdmin = role === 3;

if (!(isCoach || isAdmin)) {
  alert('Нямате права за достъп.');
  window.location.href = 'HomePage.html';
  return;
}

      const requestsContainer = document.getElementById("requests-container");
      requestsContainer.innerHTML = "<p class='muted'>Зареждане...</p>";

      try {
        const response = await fetch(`https://sportstatsapi.azurewebsites.net/api/users/pending/${user.clubID}`);
        if (!response.ok) throw new Error("Грешка при зареждане на заявки");

        const requests = await response.json();
        requestsContainer.innerHTML = "";

        if (requests.length === 0) {
          requestsContainer.innerHTML = "<p class='muted'>Няма чакащи заявки.</p>";
          return;
        }

        requests.forEach(request => {
          const el = document.createElement("article");
          el.className = "request-item";
          el.innerHTML = `
            <div class="req-main">
              <div class="req-name"><strong>${request.firstName} ${request.lastName}</strong></div>
              <div class="req-email">Email: <span>${request.email}</span></div>
            </div>
            <div class="req-actions">
              <button class="btn approve" onclick="updateStatus(${request.id}, 'approved')">
                <i class="fa-solid fa-check"></i> Одобри
              </button>
              <button class="btn reject" onclick="updateStatus(${request.id}, 'rejected')">
                <i class="fa-solid fa-xmark"></i> Отхвърли
              </button>
            </div>
          `;
          requestsContainer.appendChild(el);
        });
      } catch (err) {
        requestsContainer.innerHTML = "<p class='error'>Грешка при зареждане на заявки.</p>";
        console.error(err);
      }
    });

    async function updateStatus(userId, status) {
      const apiUrl = `https://sportstatsapi.azurewebsites.net/api/users/${status === "approved" ? "approve" : "reject"}/${userId}`;
      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });
        if (!response.ok) throw new Error("Грешка при актуализиране на статуса");

        // Леко UX подсилване
        const toast = document.createElement('div');
        toast.className = 'toast success';
        toast.textContent = 'Успешно обновен статус!';
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 200); }, 1500);

        setTimeout(() => window.location.reload(), 800);
      } catch (error) {
        console.error(error);
        alert("Грешка при обновяване на статуса.");
      }
    }
  </script>
</body>
</html>
