<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage</title>
    <link rel="stylesheet" href="HomePageStyles.css">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@700&family=Domine:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header"></div>
    <div class="container"> 
        <a href="Settings.html" class="settings-button">
            <img src="settings.png" alt="Settings" class="button-image">
            <span class="icon-label">Настройки</span>
        </a>
        
        <button id="coach-button" class="icon-button hidden" onclick="redirectToCoacherPage()">
            <img src="result.png" alt="Coach" class="button-image">
            <span class="icon-label">Резултати</span>
        </button>
        
        <button id="status-button" class="icon-button hidden">
            <img src="ask.png" alt="Status" class="button-image">
            <span class="icon-label">Заявки</span>
        </button>
        <a href="Chat.html" class="icon-button">
    <img src="chat.png" alt="Chat" class="button-image">
    <span class="icon-label">Чат</span>
</a>
        
        <div class="info">
            <img id="profile-picture" 
                 alt="Profile Picture" 
                 class="profile-image" 
                 src="https://sportstats.blob.core.windows.net/$web/ProfilePhoto2.jpg">
            
            <div class="info-section">
                <div class="info-row">
                    <div class="info-col">
                        <span class="label">Име:</span>
                        <div class="line"></div>
                        <span class="value" id="first-name">Няма данни</span>
                    </div>
                    <div class="info-col">
                        <span class="label">Роден:</span>
                        <div class="line"></div>
                        <span class="value" id="year-of-birth">Няма данни</span>
                    </div>
                </div>
            </div>
            
            <div class="info-section">
                <span class="label">Фамилия:</span>
                <div class="line"></div>
                <span class="value" id="last-name">Няма данни</span>
            </div>
            
            <div class="info-section">
                <span class="label">Клуб:</span>
                <div class="line"></div>
                <span class="value" id="club">Няма данни</span>
            </div>
            <!-- Sponsor Footer Ad -->
        </div>

        <div class="results">
            <h2>Резултати</h2>
            <form id="discipline-form">
                <select id="discipline" name="discipline">
                    <option value="" disabled selected></option>
                </select>
            </form>

            <div id="chart-container">
                <canvas id="resultsChart" width="450" height="300"></canvas>
                <div id="chart-info">
                    <p id="best-result">Най-добър резултат: </p>
                    <p id="latest-result">Последен резултат: </p>
                    <p id="normative-difference">Разлика с норматив: </p>
                    <p id="normative-value">Норматив: </p>
                </div>
            </div>
        </div>

        <div id="change-club-section" class="hidden">
            <label for="club-select">Смени клуба:</label>
            <select id="club-select">
                <option value="" disabled selected>Изберете клуб</option>
            </select>
            <button id="change-club-button">Промени</button>
        </div>
    </div>

    <div class="tables-wrapper"> 
  <div class="UserTableSection"> 
    <div class="user-results-section">
      <h3>Най-добри резултати в клуба</h3>
      <table id="users-table" class="results-table">
          <thead>
              <tr>
                  <th>Име</th>
                  <th>Година на раждане</th>
                  <th>Най-добър резултат</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="right-section">
    <div class="best-club-section">
      <h3>Клубове с най-добро време</h3>
      <table id="best-club-table" class="results-table">
        <thead>
          <tr>
            <th>Група</th>
            <th>Клуб</th>
            <th>Най-добро време</th>
          </tr>
        </thead>        
        <tbody></tbody>
      </table>
      <div id="hover-info" class="hover-info" style="display:none;"></div>
    </div>
  </div>
  
</div>

              current = (current + 1) % slides.length;
