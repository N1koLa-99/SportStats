<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>

  <!-- Твоят CSS -->
  <link rel="stylesheet" href="SettingsStyles.css" />

  <!-- Икони (очи и т.н.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- По желание можеш да фиксираш база за API -->
  <!-- <script>window.__API_BASE__='https://sportstatsapi.azurewebsites.net'</script> -->

  <!-- Скриптът (смарт fetch, валидация, toggle password, strength) -->
  <script src="SettingsScript.js" defer></script>
</head>
<body class="page">

  <!-- Глобална нотификация -->
  <div id="message-box" class="message-box" role="status" aria-live="polite">
    <div class="message-box-content">
      <div id="message-box-text"></div>
      <div class="message-box-progress">
        <div id="message-box-progress-bar" class="message-box-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Хедър -->
  <header class="header">
    <div class="wrap">
      <div class="brand">
        <h1 class="brand-title"></h1>
      </div>

      <nav class="quick-actions">
        <a href="HomePage.html" class="home-btn icon-tile" aria-label="Начало">
          <i class="fas fa-home"></i>
          <span class="nav-label">Начало</span>
        </a>

        <button id="logout-button" class="btn danger icon-tile" title="Изход">
          <i class="fas fa-sign-out-alt"></i>
          <span class="nav-label">Изход</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Основно съдържание -->
  <main class="main wrap">
    <section class="card card-profile" aria-labelledby="profile-title">
      <div class="card-head">
        <h2 id="profile-title">Профил</h2>
        <div class="actions">
          <button class="btn icon" id="edit-profile" title="Редактирай">
            <i class="fas fa-pencil-alt"></i>
          </button>
          <button class="btn primary" id="save-profile" style="display:none;">Запази</button>
          <button class="btn ghost" id="cancel-profile" style="display:none;">Назад</button>
        </div>
      </div>

      <div class="profile">
        <!-- Аватар -->
        <div class="avatar">
          <!-- JS ще замести default-profile.png; ако липсва, има вграден fallback -->
          <img id="profile-image" src="default-profile.png" alt="Профилна снимка" />
          <input type="file" id="edit-profile-image" hidden />
          <button class="btn soft" id="edit-image-button">Смени снимката</button>
        </div>

        <!-- Данни -->
        <div class="form-grid">
          <!-- Име -->
          <div class="form-row">
            <label class="label" for="edit-first-name">Име</label>
            <div class="value">
              <span id="first-name">Зарежда се...</span>
              <input type="text" id="edit-first-name" placeholder="Ново име" style="display:none;" autocomplete="off" />
              <small id="err-first-name" class="error-msg" aria-live="polite"></small>
            </div>
          </div>

          <!-- Фамилия -->
          <div class="form-row">
            <label class="label" for="edit-last-name">Фамилия</label>
            <div class="value">
              <span id="last-name">Зарежда се...</span>
              <input type="text" id="edit-last-name" placeholder="Нова фамилия" style="display:none;" autocomplete="off" />
              <small id="err-last-name" class="error-msg" aria-live="polite"></small>
            </div>
          </div>

          <!-- Година на раждане -->
          <div class="form-row">
            <label class="label" for="edit-year-of-birth">Година на раждане</label>
            <div class="value">
              <span id="year-of-birth">Зарежда се...</span>
              <select id="edit-year-of-birth" style="display:none;"></select>
              <small id="err-year-of-birth" class="error-msg" aria-live="polite"></small>
            </div>
          </div>

          <!-- Email -->
          <div class="form-row">
            <label class="label" for="edit-email">Email</label>
            <div class="value">
              <span id="email">Зарежда се...</span>
              <input type="email" id="edit-email" placeholder="Нов email" style="display:none;" autocomplete="off" />
              <small id="err-email" class="error-msg" aria-live="polite"></small>
            </div>
          </div>

          <!-- Парола -->
          <div class="form-row">
            <label class="label" for="edit-password">Парола</label>
            <div class="value password-container">
              <!-- опаковка: input + оченце вътре -->
              <div class="password-wrap">
                <input type="password" id="edit-password" placeholder="Нова парола" style="display:none;" autocomplete="new-password" />
                <button type="button" class="toggle-password fa fa-eye" data-target="edit-password" style="display:none;" aria-label="Покажи паролата"></button>
              </div>

              <!-- индикатор за сила – под полето -->
              <div id="pwd-strength" aria-live="polite"></div>

              <!-- съобщение за грешка -->
              <small id="err-password" class="error-msg" aria-live="polite"></small>
            </div>
          </div>

          <!-- Потвърждение на паролата -->
          <div class="form-row">
            <label class="label confirm-password-label" for="edit-confirm-password" style="display:none;">Потвърдете паролата</label>
            <div class="value password-container">
              <div class="password-wrap">
                <input type="password" id="edit-confirm-password" placeholder="Потвърдете новата парола" style="display:none;" autocomplete="new-password" />
                <button type="button" class="toggle-password fa fa-eye" data-target="edit-confirm-password" style="display:none;" aria-label="Покажи паролата"></button>
              </div>
              <small id="err-confirm-password" class="error-msg" aria-live="polite"></small>
            </div>
          </div>

          <!-- Клуб -->
          <div class="form-row">
            <span class="label">Клуб</span>
            <div class="value">
              <span id="club">Зарежда се...</span>
            </div>
          </div>

          <div id="changes-notification" class="note" style="display:none;"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer wrap">
    <small>© SportStats</small>
  </footer>
</body>
</html>
