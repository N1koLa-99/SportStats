<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Чат</title>
  <link rel="stylesheet" href="Groups.css" />
  <style>
    /* ==== ЛЕЙАУТ НА ЧАТА ==== */
    .chat-wrap{
      height:calc(100vh - 90px);
      max-width:1100px;
      margin:0 auto;
    }
    .chat-layout{
      display:grid;
      grid-template-columns:260px minmax(0,1fr);
      gap:16px;
      height:100%;
    }
    .chat-side{
      display:flex;
      flex-direction:column;
      border:1px solid var(--border);
      border-radius:var(--r-xl);
      background:var(--surface);
      backdrop-filter:blur(var(--glass-blur));
      -webkit-backdrop-filter:blur(var(--glass-blur));
      box-shadow:var(--shadow);
      padding:12px 12px 10px;
      min-width:0;
    }
    .chat-main{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .chat-title{font-weight:800;margin:0}
    .chat-sub{color:var(--txt-muted);font-size:13px}

    .chat-body{
      flex:1;
      min-height:0;
      border:1px solid var(--border);
      border-radius:var(--r-xl);
      background:var(--surface);
      backdrop-filter:blur(var(--glass-blur));
      -webkit-backdrop-filter:blur(var(--glass-blur));
      box-shadow:var(--shadow);
      padding:10px 10px 12px;
      display:flex;
      flex-direction:column
    }
    .msg-scroll{flex:1;min-height:0;overflow:auto;padding:4px 4px 6px}
    .load-more{display:flex;justify-content:center;margin:4px 0 2px}

    .msg{display:flex;gap:8px;margin:8px 0;max-width:80%}
    .msg.me{margin-left:auto;flex-direction:row-reverse}
    .msg .avatar{
      width:36px;height:36px;border-radius:50%;
      border:1px solid rgba(46,123,255,.25);
      background:#eef4ff;object-fit:cover
    }
    .bubble{
      padding:8px 10px;
      border-radius:16px;
      border:1px solid var(--border);
      background:#fff;
      box-shadow:var(--shadow);
      max-width:100%;
    }
    .msg.me .bubble{
      background:linear-gradient(180deg,#eef4ff 0%,#ffffff 100%);
      border-color:rgba(46,123,255,.25)
    }
    .bubble-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:4px;
    }
    .bubble .meta{font-size:12px;color:#66768b}
    .msg-delete{
      border:none;
      background:transparent;
      cursor:pointer;
      padding:0 2px;
      font-size:14px;
      color:#9aa9bb;
    }
    .msg-delete:hover{color:#ff4d4f}

    .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .att .chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 8px;border-radius:999px;font-size:12px;
      background:#f4f7fb;border:1px solid var(--border)
    }
    .att img{max-width:200px;max-height:160px;border-radius:10px;border:1px solid var(--border)}

    .chat-input{
      display:flex;gap:8px;align-items:flex-end;
      border-top:1px solid var(--border);
      padding-top:8px;margin-top:6px
    }
    .chat-input textarea{
      flex:1;resize:none;min-height:40px;max-height:120px;
      padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border)
    }
    .files{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
    .files .chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;
      background:#eef4ff;border:1px solid rgba(46,123,255,.25)
    }
    .files .chip button{all:unset;cursor:pointer;font-weight:700}

    .fab-back{position:fixed;left:20px;bottom:20px}
    .muted-small{color:#66768b;font-size:12px}

    /* === страничен списък с участници === */
    .side-title{font-weight:700;margin:0 0 4px 0;font-size:15px}
    .side-sub{margin:0;color:var(--txt-muted);font-size:12px}
    .member-list{
      margin-top:8px;
      flex:1;
      min-height:0;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .member-row{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:12px;
      border:1px solid rgba(20,30,40,.08);
      background:rgba(255,255,255,.9);
    }
    .member-row img{
      width:30px;height:30px;border-radius:50%;
      border:1px solid rgba(46,123,255,.25);
      object-fit:cover;
    }
    .member-main{flex:1;min-width:0}
    .member-name{
      font-size:13px;font-weight:600;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .member-meta{
      font-size:11px;color:var(--txt-muted);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .badge-admin{
      font-size:11px;
      padding:2px 6px;
      border-radius:999px;
      background:#eef4ff;
      border:1px solid rgba(46,123,255,.35);
      color:#2e7bff;
    }
    .btn-kick{
      border:none;
      background:transparent;
      cursor:pointer;
      font-size:16px;
      padding:0 2px;
      color:#ff6a6d;
    }
    .btn-kick:hover{color:#d9363e}

    @media (max-width: 900px){
      .chat-wrap{height:auto}
      .chat-layout{grid-template-columns:1fr}
      .chat-side{order:2}
      .chat-main{order:1}
      .fab-back{bottom:12px;left:12px}
    }
  </style>
</head>
<body class="groups-app">
  <header class="app-header">
    <div>
      <h1 class="app-title">Чат</h1>
      <div class="meta">
        <span id="meta-team" class="muted">Отбор: —</span>
        <span id="meta-user" class="muted">Потребител: —</span>
      </div>
    </div>
    <nav class="nav">
      <a href="Groups.html" class="btn">Групи</a>
      <a href="HomePage.html" class="btn">Начало</a>
    </nav>
  </header>

  <main class="content">
    <section class="chat-wrap">
      <div class="chat-layout">
        <!-- Ляво: участници в групата -->
        <aside class="chat-side">
          <div class="chat-head">
            <div>
              <p class="side-title">Участници</p>
              <p id="member-sub" class="side-sub">—</p>
            </div>
          </div>
          <div id="member-list" class="member-list"></div>
        </aside>

        <!-- Дясно: самият чат -->
        <section class="chat-main">
          <div class="chat-head">
            <div>
              <h2 id="chat-title" class="chat-title">Групов чат</h2>
              <span id="chat-sub" class="chat-sub">—</span>
            </div>
          </div>

          <div class="chat-body">
            <div id="load-older" class="load-more"></div>
            <div id="msg-scroll" class="msg-scroll"></div>

            <form id="send-form" class="chat-input">
              <input id="file-input" type="file" multiple hidden />
              <button id="btn-file" class="btn secondary" type="button">Прикачи</button>
              <textarea id="msg-text" placeholder="Напиши съобщение…"></textarea>
              <button id="btn-send" class="btn primary" type="submit">Изпрати</button>
            </form>
            <div id="files" class="files"></div>
            <p id="err" class="error" hidden></p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <a class="btn fab-back" href="Groups.html">← Назад</a>

  <script src="GroupChat.js"></script>
</body>
</html>
