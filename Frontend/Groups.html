<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Групови чатове</title>
  <link rel="stylesheet" href="Groups.css" />
</head>
<body class="groups-app">
  <header class="app-header">
    <div>
      <h1 class="app-title">Групови чатове</h1>
      <div class="meta">
        <span id="meta-team" class="muted">Отбор: —</span>
        <span id="meta-user" class="muted">Потребител: —</span>
      </div>
    </div>
    <nav class="nav">
      <a href="HomePage.html" class="btn">Начало</a>
      <a href="Chat.html" class="btn">Отборен чат</a>
      <button id="btn-open-create-group" class="btn primary">Създай група</button>
    </nav>
  </header>

  <main class="content">

    <!-- Инфо за права и авторизация -->
    <section class="card info-card">
      <div class="info-row">
        <div>
          <p id="role-hint" class="muted">—</p>
          <div id="auth-hint" class="muted small"></div>
        </div>
      </div>
    </section>

    <!-- Моите групи -->
    <section class="card">
      <header class="chats-header">
        <div>
          <h2 class="section-title">Моите групи</h2>
          <p class="muted small">Избери група от списъка или създай нова.</p>
        </div>
        <div class="chats-controls">
          <input id="chat-search" type="search" placeholder="Търси по име на група…" />
          <select id="chat-sort">
            <option value="activity">По активност</option>
            <option value="name">По име</option>
          </select>
          <label class="toggle small">
            <input id="chat-unread-only" type="checkbox" />
            Само с непрочетени
          </label>
        </div>
      </header>

      <div id="my-chats"></div>
      <div id="empty-chats" class="muted" hidden></div>
    </section>

  </main>

  <!-- Модален прозорец за създаване на група -->
  <dialog id="dlg-create-group">
    <form id="form-create-group" method="dialog" enctype="multipart/form-data" class="dlg-form">
      <header class="dlg-header">
        <h3 class="dlg-title">Нова група</h3>
        <p class="muted small">Избери име, снимка и членове от твоя клуб.</p>
      </header>

      <div class="dlg-body">
        <label class="fld">
          <span>Име на групата <b class="req">*</b></span>
          <input id="cg-name" type="text" required maxlength="80" placeholder="напр. Треньори U17" />
        </label>

        <label class="fld">
          <span>Снимка (по желание)</span>
          <input id="cg-photo" type="file" accept="image/*" />
          <div id="cg-preview" class="preview" hidden>
            <img id="cg-preview-img" alt="Преглед" />
            <button id="cg-preview-clear" type="button" class="btn small danger">Премахни</button>
          </div>
        </label>

        <div class="fld">
          <span>Членове от твоя клуб</span>
          <input id="cg-search" type="search" placeholder="Търси по име…" />
          <div class="member-toolbar">
            <span id="cg-selected-meta" class="sel-meta">Няма избрани участници.</span>
            <div class="row gap">
              <button id="cg-select-all" class="btn small secondary" type="button">Избери всички</button>
              <button id="cg-clear-all" class="btn small secondary" type="button">Изчисти</button>
            </div>
          </div>
          <div id="cg-member-grid" class="member-grid"></div>
          <div id="cg-selected-chips" class="chips"></div>
        </div>

        <div id="cg-err" class="error" hidden></div>
      </div>

      <menu class="dlg-actions">
        <button id="cg-cancel" type="reset" class="btn">Отказ</button>
        <button id="cg-create" type="submit" class="btn primary">Създай група</button>
      </menu>
    </form>
  </dialog>

  <script src="Groups.js"></script>
</body>
</html>
